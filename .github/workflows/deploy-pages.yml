name: Publicar sitio en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retirar rutas dinámicas (GitHub Pages no ejecuta el servidor)
        run: rm -rf app/api app/personal
      - run: npm run build:pages
        # El formulario dirige el guardado al sitio Vercel.
        env:
          GITHUB_PAGES_EXPORT: true
          NEXT_PUBLIC_BASE_PATH: /web-jms
          NEXT_PUBLIC_MATRICULA_URL: https://escuela-juliomontt.vercel.app/reserva-matricula/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
